{% extends "base.html" %}
{% block title %}إدارة المقترحات{% endblock %}

{% block content %}
<section class="cards">
  {% for p in proposals %}
  <div class="card">
    <h3>{{ p[1] }}</h3>
    <p><strong>النوع:</strong> {{ p[2] }}</p>
    <p>{{ p[3] }}</p>
    <p><strong>المحافظة:</strong> {{ p[4] or "غير محددة" }}</p>

    <form method="POST">
      <input type="hidden" name="id" value="{{ p[0] }}">
      <select name="status">
        <option value="approved">قبول</option>
        <option value="rejected">رفض</option>
        <option value="pending">قيد المراجعة</option>
      </select>
      <button class="btn primary small">تحديث</button>
    </form>
  </div>
  {% endfor %}
</section>
{% endblock %}
